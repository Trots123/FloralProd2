<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora — Магазин цветов</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f7f5;
            color: #292929;
        }
        header {
            background: white;
            padding: 20px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 2px 12px #00000010;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #b34e75;
        }
        button {
            cursor: pointer;
            border: 0;
            border-radius: 9px;
            padding: 12px 17px;
            font-size: 14px;
            font-weight: bold;
            background: #b34e75;
            color: white;
        }
        button:hover { background: #94395d; }
        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .secondary {
            background: #f5e7ed;
            color: #9c3b60;
        }
        .secondary:hover { background: #eed4df; }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        main { max-width: 1200px; margin: auto; padding: 35px 20px; }
        h1 { font-size: 34px; }
        h2 { margin-top: 30px; }
        .hero {
            padding: 35px;
            background: #f4dce5;
            border-radius: 18px;
            margin-bottom: 35px;
        }
        .hero p { color: #704a59; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }
        .product {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px #00000009;
        }
        .flower-icon {
            font-size: 65px;
            text-align: center;
            background: #fbf0f4;
            border-radius: 12px;
            padding: 30px;
        }
        .product h3 { margin-bottom: 8px; }
        .price {
            font-size: 22px;
            color: #b34e75;
            font-weight: bold;
        }
        .muted { color: #777; font-size: 14px; }
        .product button { width: 100%; margin-top: 12px; }
        .panel {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 7px 0 14px;
            font: inherit;
        }
        .hidden { display: none !important; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            border-radius: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close {
            background: #eee;
            color: #333;
        }
        .message {
            padding: 13px;
            margin: 15px 0;
            border-radius: 8px;
            background: #f5e7ed;
        }
        .total {
            text-align: right;
            font-size: 23px;
            font-weight: bold;
            margin: 20px 0;
        }
        @media(max-width: 600px) {
            header { padding: 15px; flex-wrap: wrap; }
            h1 { font-size: 27px; }
            .hero { padding: 23px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="showPage('catalog')" style="cursor:pointer">
        🌸 Flora
    </div>
    <div class="actions">
        <button class="secondary" onclick="showPage('catalog')">
            Каталог
        </button>
        <button id="registerButton" onclick="openModal('registerModal')">
            Регистрация
        </button>
        <button id="profileButton" class="secondary hidden"
                onclick="showPage('profile')">
            Личный кабинет
        </button>
        <button id="cartButton" class="secondary hidden"
                onclick="showPage('cart')">
            🛒 Корзина
        </button>
    </div>
</header>

<main>
    <div id="notification" class="message hidden"></div>

    <section id="catalogPage">
        <div class="hero">
            <h1>Цветы для особенных моментов 🌷</h1>
            <p>Выберите любимые цветы и оформите заказ.</p>
        </div>
        <h2>Наши цветы</h2>
        <div id="products" class="grid">
            Загрузка товаров...
        </div>
    </section>

    <section id="cartPage" class="hidden">
        <h1>Моя корзина</h1>
        <div class="panel">
            <div id="cartItems">Загрузка корзины...</div>
            <div id="cartTotal" class="total"></div>
            <button id="checkoutButton" onclick="openCheckout()">
                Оформить заказ
            </button>
        </div>
    </section>

    <section id="profilePage" class="hidden">
        <h1>Личный кабинет</h1>
        <div class="panel" id="profileInfo"></div>
        <h2>История заказов</h2>
        <div class="panel" id="orderHistory"></div>
    </section>
</main>

<div id="registerModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Регистрация</h2>
            <button class="close" onclick="closeModal('registerModal')">✕</button>
        </div>
        <form id="registerForm">
            <label>Ваше имя</label>
            <input id="clientName" required placeholder="Введите имя">

            <label>Номер телефона</label>
            <input id="clientPhone" required placeholder="+380...">

            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>
</div>

<div id="checkoutModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Оформление заказа</h2>
            <button class="close" onclick="closeModal('checkoutModal')">✕</button>
        </div>
        <form id="checkoutForm">
            <label>Город</label>
            <input id="city" required>

            <label>Улица</label>
            <input id="street" required>

            <label>Дом</label>
            <input id="house" required>

            <label>Квартира (необязательно)</label>
            <input id="apartment">

            <label>Комментарий</label>
            <textarea id="comment"></textarea>

            <button type="submit">Подтвердить заказ</button>
        </form>
    </div>
</div>

<script>
    const API = window.location.origin;
    let clientId = localStorage.getItem("floraClientId");

    function notify(message) {
        const element = document.getElementById("notification");
        element.textContent = message;
        element.classList.remove("hidden");
    }

    function openModal(id) {
        document.getElementById(id).classList.remove("hidden");
    }

    function closeModal(id) {
        document.getElementById(id).classList.add("hidden");
    }

    async function api(path, options = {}) {
        const response = await fetch(API + path, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...options.headers
            }
        });

        if (!response.ok) {
            const error = await response.text();
            throw new Error(error || "HTTP " + response.status);
        }

        const text = await response.text();

        if (!text) return null;

        try {
            return JSON.parse(text);
        } catch {
            return text;
        }
    }

    function updateHeader() {
        document.getElementById("registerButton")
            .classList.toggle("hidden", !!clientId);

        document.getElementById("profileButton")
            .classList.toggle("hidden", !clientId);

        document.getElementById("cartButton")
            .classList.toggle("hidden", !clientId);
    }

    async function showPage(page) {
        ["catalog", "cart", "profile"].forEach(name => {
            document.getElementById(name + "Page")
                .classList.toggle("hidden", name !== page);
        });

        if (page === "cart") await loadCart();
        if (page === "profile") await loadProfile();
    }

    function createElement(tag, text, className) {
        const element = document.createElement(tag);
        if (text !== undefined) element.textContent = text;
        if (className) element.className = className;
        return element;
    }

    async function loadProducts() {
        const container = document.getElementById("products");
        container.textContent = "Загрузка товаров...";

        try {
            const products = await api("/products");
            container.replaceChildren();

            if (!Array.isArray(products) || products.length === 0) {
                container.textContent = "Товары пока отсутствуют.";
                return;
            }

            products.forEach(product => {
                const card = createElement("div", undefined, "product");
                const icon = createElement("div", "🌹", "flower-icon");
                const name = createElement("h3", product.name ?? "Без названия");
                const description = createElement(
                    "p", product.description ?? "", "muted"
                );
                const price = createElement(
                    "div", String(product.price ?? "—"), "price"
                );
                const stock = createElement(
                    "p",
                    "В наличии: " + (product.stockQuantity ?? "не указано"),
                    "muted"
                );
                const button = createElement("button", "Добавить в корзину");

                button.disabled = !product.id ||
                    product.stockQuantity === 0;

                button.onclick = () => addToCart(product.id);

                card.append(icon, name, description, price, stock, button);
                container.appendChild(card);
            });
        } catch (error) {
            container.textContent = "Не удалось загрузить товары.";
            notify(error.message);
        }
    }

    async function addToCart(productId) {
        if (!clientId) {
            openModal("registerModal");
            notify("Сначала зарегистрируйтесь.");
            return;
        }

        try {
            await api("/carts/add", {
                method: "POST",
                body: JSON.stringify({
                    clientId: Number(clientId),
                    productId: Number(productId),
                    quantity: 1
                })
            });

            notify("Товар добавлен в корзину!");
        } catch (error) {
            notify("Ошибка добавления: " + error.message);
        }
    }

    document.getElementById("registerForm")
        .addEventListener("submit", async event => {
            event.preventDefault();

            const name = document.getElementById("clientName").value.trim();
            const phone = document.getElementById("clientPhone").value.trim();

            try {
                const client = await api("/clients", {
                    method: "POST",
                    body: JSON.stringify({
                        name: name,
                        phoneNumber: phone,
                        balance: 0
                    })
                });

                // POST /clients должен возвращать созданного клиента
                // с полем id.
                if (!client || !client.id) {
                    throw new Error(
                        "Бэкенд не вернул ID созданного клиента."
                    );
                }

                clientId = String(client.id);
                localStorage.setItem("floraClientId", clientId);
                updateHeader();
                closeModal("registerModal");
                notify("Регистрация прошла успешно!");
            } catch (error) {
                notify("Ошибка регистрации: " + error.message);
            }
        });

    async function loadCart() {
        const container = document.getElementById("cartItems");
        const totalElement = document.getElementById("cartTotal");
        const checkoutButton = document.getElementById("checkoutButton");

        container.textContent = "Загрузка...";
        totalElement.textContent = "";
        checkoutButton.disabled = true;

        if (!clientId) {
            container.textContent = "Сначала зарегистрируйтесь.";
            return;
        }

        try {
            const items = await api(
                "/cartsDTO/" + encodeURIComponent(clientId) + "/cart"
            );

            container.replaceChildren();

            if (!Array.isArray(items) || items.length === 0 ||
                items.every(item => item.prodId == null)) {
                container.textContent = "Корзина пуста.";
                return;
            }

            let total = 0;

            items.filter(item => item.prodId != null).forEach(item => {
                const row = createElement("div", undefined, "cart-item");
                const info = createElement(
                    "div",
                    (item.prodName ?? "Товар") +
                    " × " + item.quantity
                );
                const amount = createElement(
                    "strong", String(item.total ?? "—")
                );

                row.append(info, amount);
                container.appendChild(row);

                total += Number(item.total ?? 0);
            });

            totalElement.textContent = "Итого: " + total.toFixed(2);
            checkoutButton.disabled = false;
        } catch (error) {
            container.textContent = "Не удалось загрузить корзину.";
            notify(error.message);
        }
    }

    async function loadProfile() {
        const profile = document.getElementById("profileInfo");
        const history = document.getElementById("orderHistory");

        profile.textContent = "Загрузка...";
        history.textContent = "Загрузка...";

        try {
            const client = await api("/clients/" + clientId);
            profile.replaceChildren();

            profile.append(
                createElement("h3", client.name ?? "Клиент"),
                createElement("p", "Телефон: " +
                    (client.phoneNumber ?? client.phone_number ?? "—")),
                createElement("p", "Баланс: " +
                    (client.balance ?? "—"))
            );
        } catch (error) {
            profile.textContent = "Ошибка загрузки профиля: " + error.message;
        }

        try {
            const orders = await api("/orders");

            history.replaceChildren();

            if (!Array.isArray(orders)) {
                history.textContent = "История заказов недоступна.";
                return;
            }

            // Для правильной истории нужен endpoint,
            // возвращающий заказы конкретного клиента.
            history.textContent =
                "Для отображения истории клиента нужен " +
                "GET /orders/client/" + clientId +
                " или аналогичный endpoint на бэкенде.";
        } catch (error) {
            history.textContent =
                "Не удалось загрузить историю заказов: " + error.message;
        }
    }

    function openCheckout() {
        if (!clientId) {
            openModal("registerModal");
            return;
        }
        openModal("checkoutModal");
    }

    document.getElementById("checkoutForm")
        .addEventListener("submit", async event => {
            event.preventDefault();

            const deliveryAddress = {
                city: document.getElementById("city").value.trim(),
                street: document.getElementById("street").value.trim(),
                house: document.getElementById("house").value.trim(),
                apartment: document.getElementById("apartment").value.trim(),
                comment: document.getElementById("comment").value.trim()
            };

            // Нужно согласовать тело запроса с CheckoutController.
            // Здесь адрес отправляется одним полем.
            const request = {
                clientId: Number(clientId),
                deliveryAddress:
                    [
                        deliveryAddress.city,
                        deliveryAddress.street,
                        deliveryAddress.house,
                        deliveryAddress.apartment
                    ].filter(Boolean).join(", "),
                deliveryComment: deliveryAddress.comment
            };

            try {
                await api("/checkout", {
                    method: "POST",
                    body: JSON.stringify(request)
                });

                closeModal("checkoutModal");
                notify("Заказ успешно оформлен!");
                await loadCart();
            } catch (error) {
                notify("Ошибка оформления заказа: " + error.message);
            }
        });

    updateHeader();
    loadProducts();
</script>

</body>
