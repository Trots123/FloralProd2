<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor — Магазин цветов</title>

    <style>
        :root {
            --green: #254c3c;
            --green-light: #426a56;
            --pink: #f4dfdf;
            --cream: #faf8f3;
            --text: #283b31;
            --gray: #7b847e;
            --border: #e9e9e3;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        [hidden] {
            display: none !important;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: bold;
            color: var(--green);
            text-decoration: none;
        }

        .logo span {
            color: #d59da7;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: white;
            color: var(--green);
            border: 1px solid var(--green);
            padding: 11px 17px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover:not(:disabled) {
            opacity: 0.8;
        }

        .primary {
            background: var(--green);
            color: white;
        }

        .danger {
            color: #b44343;
            border-color: #b44343;
        }

        .full {
            width: 100%;
        }

        /* HERO */

        .hero {
            background: linear-gradient(110deg, #f5e1e1, #f7f2e6);
            padding: 90px 25px;
        }

        .hero-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: 64px;
            font-weight: normal;
            color: var(--green);
            max-width: 650px;
            margin: 15px 0;
        }

        .hero p {
            max-width: 500px;
            line-height: 1.7;
            color: #69776e;
            font-size: 18px;
        }

        .flower-art {
            font-size: 160px;
            padding: 20px;
        }

        /* CATALOG */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 50px 24px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 36px;
            color: var(--green);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(240px, 1fr)
            );
            gap: 24px;
        }

        .product {
            background: white;
            border: 1px solid #eee;
            border-radius: 18px;
            overflow: hidden;
        }

        .product-image {
            height: 185px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                    140deg,
                    #f3dddd,
                    #f4f0e7
            );
            font-size: 85px;
        }

        .product-body {
            padding: 20px;
        }

        .product h3 {
            margin: 0 0 12px;
        }

        .product p {
            color: var(--gray);
            min-height: 40px;
            line-height: 1.5;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            margin: 14px 0;
            color: var(--green);
        }

        .stock {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 15px;
        }

        /* MODALS */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 20;
        }

        .panel {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 21;
            height: 100vh;
            width: min(460px, 100%);
            overflow-y: auto;
            background: white;
            padding: 27px;
            box-shadow: -10px 0 30px #0002;
        }

        .modal {
            position: fixed;
            z-index: 21;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(430px, calc(100% - 30px));
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 28px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .close {
            background: none;
            border: none;
            font-size: 32px;
            color: #888;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .tabs .btn {
            flex: 1;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
        }

        /* CART */

        .cart-item {
            padding: 19px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .cart-controls button {
            padding: 7px 12px;
        }

        .cart-total {
            font-size: 24px;
            font-weight: bold;
            margin: 25px 0;
        }

        /* PROFILE */

        .profile-box {
            background: var(--cream);
            padding: 20px;
            border-radius: 12px;
            line-height: 2;
        }

        .order {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .muted {
            color: var(--gray);
        }

        .error {
            color: #b44343;
        }

        .success {
            color: #267449;
        }

        .toast {
            position: fixed;
            z-index: 30;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--green);
            color: white;
            padding: 15px 23px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
        }

        footer {
            background: var(--green);
            color: white;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 700px) {
            nav {
                flex-wrap: wrap;
            }

            .hero {
                padding: 50px 20px;
            }

            .hero h1 {
                font-size: 43px;
            }

            .flower-art {
                display: none;
            }

            .container {
                padding: 35px 18px;
            }

            .actions .btn {
                padding: 9px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->

<header>
    <nav>
        <a href="/" class="logo" id="homeBtn">
            ✿ Flor<span>.</span>
        </a>

        <div class="actions">
            <button class="btn" id="loginBtn">
                Войти / Регистрация
            </button>

            <button class="btn" id="profileBtn" hidden>
                👤 Личный кабинет
            </button>

            <button class="btn" id="cartBtn">
                🛍 Корзина
            </button>
        </div>
    </nav>
</header>

<!-- MAIN -->

<main>
    <section class="hero">
        <div class="hero-inner">
            <div>
                <p>✦ ЦВЕТЫ ДЛЯ ОСОБЕННЫХ МОМЕНТОВ</p>

                <h1>
                    Цветы, которые говорят за вас
                </h1>

                <p>
                    Свежие цветы и красивые букеты
                    для самых важных моментов.
                </p>

                <button class="btn primary" id="catalogBtn">
                    Смотреть каталог →
                </button>
            </div>

            <div class="flower-art">🌸</div>
        </div>
    </section>

    <section class="container" id="catalog">
        <h2>Наши цветы</h2>

        <p class="muted">
            Выберите свой идеальный букет.
        </p>

        <div class="products" id="products">
            Загрузка товаров...
        </div>
    </section>
</main>

<footer>
    ✿ Flor — с любовью к цветам © 2026
</footer>

<!-- OVERLAY -->

<div class="overlay" id="overlay" hidden></div>

<!-- LOGIN / REGISTER -->

<div class="modal" id="authModal" hidden>
    <div class="panel-head">
        <h2 id="authTitle">Вход</h2>
        <button class="close" data-close>×</button>
    </div>

    <div class="tabs">
        <button class="btn primary" id="loginTab">
            Вход
        </button>

        <button class="btn" id="registerTab">
            Регистрация
        </button>
    </div>

    <form id="authForm">
        <div class="field" id="nameField" hidden>
            <label for="authName">Имя</label>

            <input
                    id="authName"
                    placeholder="Анна"
            >
        </div>

        <div class="field">
            <label for="authPhone">Телефон</label>

            <input
                    id="authPhone"
                    placeholder="+380991234567"
                    required
            >
        </div>

        <div class="field">
            <label for="authPassword">Пароль</label>

            <input
                    id="authPassword"
                    type="password"
                    required
            >
        </div>

        <button
                class="btn primary full"
                type="submit"
                id="authSubmit"
        >
            Войти
        </button>

        <p id="authMessage"></p>
    </form>
</div>

<!-- CART -->

<aside class="panel" id="cartPanel" hidden>
    <div class="panel-head">
        <h2>Корзина</h2>
        <button class="close" data-close>×</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total" id="cartTotal">
        Итого: 0
    </div>

    <button class="btn primary full" id="checkoutBtn">
        Оформить заказ
    </button>
</aside>

<!-- PROFILE -->

<aside class="panel" id="profilePanel" hidden>
    <div class="panel-head">
        <h2>Личный кабинет</h2>
        <button class="close" data-close>×</button>
    </div>

    <div id="profileInfo"></div>

    <h3>История заказов</h3>

    <div id="orderHistory"></div>

    <button
            class="btn danger full"
            id="logoutBtn"
            style="margin-top:30px"
    >
        Выйти из аккаунта
    </button>
</aside>

<!-- NOTIFICATIONS -->

<div class="toast" id="toast" hidden></div>

<script>
    const $ = id => document.getElementById(id);

    let currentUser = null;
    let cart = [];
    let authMode = "login";
    let csrfToken = null;

    // УТИЛИТЫ

    function money(value) {
        return Number(value || 0).toLocaleString("ru-RU", {
            maximumFractionDigits: 2
        });
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(
            /[&<>"']/g,
            ch => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[ch]
        );
    }

    function notify(message) {
        const toast = $("toast");

        toast.textContent = message;
        toast.hidden = false;

        clearTimeout(notify.timer);

        notify.timer = setTimeout(() => {
            toast.hidden = true;
        }, 4000);
    }

    function closePanels() {
        $("overlay").hidden = true;
        $("authModal").hidden = true;
        $("cartPanel").hidden = true;
        $("profilePanel").hidden = true;
    }

    function openPanel(id) {
        closePanels();

        $(id).hidden = false;
        $("overlay").hidden = false;
    }

    // CSRF

    async function getCsrf() {
        const response = await fetch("/auth/csrf", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Не удалось получить CSRF-токен"
            );
        }

        const data = await response.json();

        csrfToken = data.token;

        return csrfToken;
    }

    // HTTP REQUESTS

    async function request(path, options = {}) {
        const method = (
            options.method || "GET"
        ).toUpperCase();

        const headers = {
            ...(options.headers || {})
        };

        if (options.body !== undefined) {
            headers["Content-Type"] = "application/json";
        }

        if (!["GET", "HEAD", "OPTIONS"].includes(method)) {
            const token = await getCsrf();

            headers["X-XSRF-TOKEN"] = token;
        }

        const response = await fetch(path, {
            ...options,
            method,
            headers,
            credentials: "same-origin"
        });

        const text = await response.text();

        let data;

        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            data = text;
        }

        if (!response.ok) {
            let message = typeof data === "string"
                ? data
                : data?.message ||
                data?.detail ||
                data?.error ||
                "Ошибка запроса";

            if (response.status === 401) {
                message = "Необходимо войти в аккаунт";
            }

            if (response.status === 403) {
                message = "Доступ запрещён или ошибка CSRF";
            }

            throw new Error(message);
        }

        return data;
    }

    // AUTH

    function updateNavigation() {
        $("loginBtn").hidden = Boolean(currentUser);
        $("profileBtn").hidden = !currentUser;
    }

    async function loadCurrentUser() {
        try {
            currentUser = await request("/auth/me");
        } catch {
            currentUser = null;
        }

        updateNavigation();
    }

    function setAuthMode(mode) {
        authMode = mode;

        const register = mode === "register";

        $("authTitle").textContent = register
            ? "Регистрация"
            : "Вход";

        $("nameField").hidden = !register;
        $("authName").required = register;

        $("authSubmit").textContent = register
            ? "Зарегистрироваться"
            : "Войти";

        $("loginTab").classList.toggle(
            "primary",
            !register
        );

        $("registerTab").classList.toggle(
            "primary",
            register
        );

        $("authMessage").textContent = "";
    }

    $("loginBtn").onclick = () => {
        setAuthMode("login");
        openPanel("authModal");
    };

    $("loginTab").onclick = () => {
        setAuthMode("login");
    };

    $("registerTab").onclick = () => {
        setAuthMode("register");
    };

    $("authForm").onsubmit = async event => {
        event.preventDefault();

        const name = $("authName").value.trim();
        const phoneNumber = $("authPhone").value.trim();
        const password = $("authPassword").value;

        const button = $("authSubmit");

        button.disabled = true;

        try {
            if (authMode === "register") {
                await request("/auth/register", {
                    method: "POST",
                    body: JSON.stringify({
                        name,
                        phoneNumber,
                        password
                    })
                });

                setAuthMode("login");

                $("authMessage").className = "success";

                $("authMessage").textContent =
                    "Регистрация успешна. Теперь войдите.";

            } else {
                await request("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({
                        phoneNumber,
                        password
                    })
                });

                await loadCurrentUser();

                if (!currentUser) {
                    throw new Error(
                        "Не удалось загрузить профиль"
                    );
                }

                closePanels();

                $("authPassword").value = "";

                notify("Добро пожаловать в Flor!");
            }

        } catch (error) {
            $("authMessage").className = "error";
            $("authMessage").textContent = error.message;

        } finally {
            button.disabled = false;
        }
    };

    // PRODUCTS

    async function loadProducts() {
        const container = $("products");

        try {
            const products = await request("/product");

            if (!Array.isArray(products) || !products.length) {
                container.textContent = "Товаров пока нет";
                return;
            }

            container.innerHTML = products.map(product => {
                const stock = Number(
                    product.stockQuantity ?? 0
                );

                return `
                    <div class="product">
                        <div class="product-image">🌷</div>

                        <div class="product-body">
                            <h3>${escapeHtml(product.name)}</h3>

                            <p>
                                ${escapeHtml(product.description || "")}
                            </p>

                            <div class="price">
                                ${money(product.price)}
                            </div>

                            <div class="stock">
                                ${
                    stock > 0
                        ? "В наличии: " + stock
                        : "Нет в наличии"
                }
                            </div>

                            <button
                                class="btn primary full"
                                data-add="${Number(product.id)}"
                                ${stock <= 0 ? "disabled" : ""}
                            >
                                Добавить в корзину
                            </button>
                        </div>
                    </div>
                `;
            }).join("");

        } catch (error) {
            container.textContent =
                "Ошибка загрузки товаров: " + error.message;
        }
    }

    $("products").addEventListener("click", event => {
        const button = event.target.closest("[data-add]");

        if (button) {
            addToCart(Number(button.dataset.add));
        }
    });

    // CART

    async function addToCart(prodId) {
        if (!currentUser) {
            setAuthMode("login");
            openPanel("authModal");

            notify("Сначала войдите в аккаунт");
            return;
        }

        try {
            await request("/carts/my-items", {
                method: "POST",
                body: JSON.stringify({
                    prodId,
                    quantity: 1
                })
            });

            notify("Товар добавлен в корзину");

        } catch (error) {
            notify(error.message);
        }
    }

    async function loadCart() {
        $("cartItems").textContent =
            "Загрузка корзины...";

        try {
            cart = await request("/cartsDTO/my-cart");

            if (!Array.isArray(cart)) {
                cart = [];
            }

            renderCart();

        } catch (error) {
            cart = [];

            $("cartItems").textContent = error.message;

            $("checkoutBtn").disabled = true;
        }
    }

    function renderCart() {
        if (!cart.length) {
            $("cartItems").innerHTML =
                '<p class="muted">Корзина пуста 🌷</p>';

            $("cartTotal").textContent = "Итого: 0";

            $("checkoutBtn").disabled = true;
            return;
        }

        let total = 0;

        $("cartItems").innerHTML = cart.map(item => {
            total += Number(item.total || 0);

            return `
                <div class="cart-item">
                    <h3>${escapeHtml(item.prodName)}</h3>

                    <p>Цена: ${money(item.price)}</p>

                    <p>Сумма: ${money(item.total)}</p>

                    <div class="cart-controls">
                        <button
                            class="btn"
                            data-change="${item.itemId}"
                            data-quantity="${item.quantity - 1}"
                        >
                            −
                        </button>

                        <strong>${item.quantity}</strong>

                        <button
                            class="btn"
                            data-change="${item.itemId}"
                            data-quantity="${item.quantity + 1}"
                        >
                            +
                        </button>

                        <button
                            class="btn danger"
                            data-delete="${item.itemId}"
                        >
                            Удалить
                        </button>
                    </div>
                </div>
            `;
        }).join("");

        $("cartTotal").textContent =
            "Итого: " + money(total);

        $("checkoutBtn").disabled = false;
    }

    async function changeQuantity(itemId, quantity) {
        if (quantity < 1) {
            await deleteCartItem(itemId);
            return;
        }

        try {
            await request(`/carts/my-items/${itemId}`, {
                method: "PUT",
                body: JSON.stringify({
                    quantity
                })
            });

            await loadCart();

        } catch (error) {
            notify(error.message);
        }
    }

    async function deleteCartItem(itemId) {
        try {
            await request(`/carts/my-items/${itemId}`, {
                method: "DELETE"
            });

            await loadCart();

            notify("Товар удалён");

        } catch (error) {
            notify(error.message);
        }
    }

    $("cartItems").addEventListener("click", async event => {
        const change = event.target.closest("[data-change]");
        const remove = event.target.closest("[data-delete]");

        if (change) {
            await changeQuantity(
                Number(change.dataset.change),
                Number(change.dataset.quantity)
            );
        }

        if (remove) {
            await deleteCartItem(
                Number(remove.dataset.delete)
            );
        }
    });

    $("cartBtn").onclick = async () => {
        if (!currentUser) {
            setAuthMode("login");
            openPanel("authModal");
            return;
        }

        openPanel("cartPanel");

        await loadCart();
    };

    // CHECKOUT

    $("checkoutBtn").onclick = async () => {
        if (!cart.length) {
            return;
        }

        const button = $("checkoutBtn");

        button.disabled = true;

        try {
            await request("/orders/checkout", {
                method: "POST"
            });

            notify("Заказ успешно оформлен!");

            await loadCart();

        } catch (error) {
            notify(error.message);

        } finally {
            if (cart.length) {
                button.disabled = false;
            }
        }
    };

    // PROFILE

    async function loadProfile() {
        $("profileInfo").textContent = "Загрузка...";

        $("orderHistory").textContent =
            "Загрузка истории...";

        try {
            currentUser = await request("/auth/me");

            updateNavigation();

            $("profileInfo").innerHTML = `
                <div class="profile-box">
                    <strong>
                        ${escapeHtml(currentUser.name)}
                    </strong>

                    <div>
                        Телефон:
                        ${escapeHtml(currentUser.phoneNumber)}
                    </div>

                    <div>
                        Баланс:
                        <strong>
                            ${money(currentUser.balance)}
                        </strong>
                    </div>
                </div>
            `;

        } catch (error) {
            $("profileInfo").textContent = error.message;
        }

        try {
            const orders = await request("/orders/my-orders");

            if (!Array.isArray(orders) || !orders.length) {
                $("orderHistory").innerHTML =
                    '<p class="muted">Заказов пока нет</p>';
                return;
            }

            $("orderHistory").innerHTML = orders.map(order => `
                <div class="order">
                    <strong>
                        Заказ №${escapeHtml(
                order.id ?? order.orderId ?? "—"
            )}
                    </strong>

                    <p>
                        Сумма:
                        ${money(
                order.totalPrice ?? order.total
            )}
                    </p>

                    <p class="muted">
                        ${escapeHtml(order.createdAt || "")}
                    </p>
                </div>
            `).join("");

        } catch (error) {
            $("orderHistory").textContent = error.message;
        }
    }

    $("profileBtn").onclick = async () => {
        openPanel("profilePanel");

        await loadProfile();
    };

    // LOGOUT

    $("logoutBtn").onclick = async () => {
        const button = $("logoutBtn");

        button.disabled = true;

        try {
            const token = await getCsrf();

            const response = await fetch("/logout", {
                method: "POST",
                credentials: "same-origin",
                redirect: "manual",
                headers: {
                    "X-XSRF-TOKEN": token
                }
            });

            if (
                !response.ok &&
                response.status !== 302 &&
                response.type !== "opaqueredirect"
            ) {
                throw new Error(
                    "Ошибка выхода. HTTP " + response.status
                );
            }

            // Проверяем, что сессия завершена

            const meResponse = await fetch("/auth/me", {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            if (meResponse.ok) {
                throw new Error(
                    "Сессия осталась активной"
                );
            }

            currentUser = null;
            cart = [];
            csrfToken = null;

            window.location.replace("/");

        } catch (error) {
            console.error("Ошибка выхода:", error);

            notify(
                "Не удалось выйти: " + error.message
            );

            button.disabled = false;
        }
    };

    // NAVIGATION

    $("homeBtn").onclick = event => {
        event.preventDefault();

        closePanels();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    };

    $("catalogBtn").onclick = () => {
        $("catalog").scrollIntoView({
            behavior: "smooth"
        });
    };

    $("overlay").onclick = closePanels;

    document.querySelectorAll("[data-close]").forEach(button => {
        button.onclick = closePanels;
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closePanels();
        }
    });

    // INITIALIZATION

    async function init() {
        await Promise.all([
            loadCurrentUser(),
            loadProducts()
        ]);
    }

    init();
</script>

</body>
</html>
